<nav>
  @for (query of searchService.history(); track query) {
    <div class="container">
      <a class="key" [routerLink]="['history', query]" routerLinkActive="active">
        <app-icon name="saved-search" size="2rem" />
        <p class="label">{{ query.replaceAll('-', ' ') }}</p>
      </a>
      <app-icon class="close-icon" name="close" size="1.5rem" (click)="removeAndRedirect(query)" />
    </div>
  }
</nav>
